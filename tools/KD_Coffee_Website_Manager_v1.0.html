<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KD Coffee Website Manager v1.0</title>
<style>
:root{--bg:#f4efe6;--paper:#fffdf8;--ink:#241c17;--muted:#75685d;--line:#d9cdbf;--accent:#76533b;--green:#315f43;--danger:#a64232}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:rgba(36,28,23,.96);color:white;padding:14px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top h1{font-size:17px;margin:0 auto 0 0}.btn{border:1px solid #ffffff55;background:transparent;color:inherit;border-radius:999px;padding:9px 15px}.btn.primary{background:#fff;color:#241c17}.btn.save{background:#d9b58c;color:#241c17;border:0}.status{font-size:13px;color:#f0d9bd}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 65px)}aside{padding:24px 16px;border-right:1px solid var(--line);background:#ece4d8}aside button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;margin-bottom:6px}aside button.active{background:var(--paper);font-weight:700}.hint{font-size:12px;line-height:1.7;color:var(--muted);margin-top:24px}main{padding:28px;max-width:1250px;width:100%}.panel{display:none}.panel.active{display:block}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}.panel h2{margin:0;font-size:28px}.panel-head p{margin:5px 0 0;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);background:white;border-radius:9px;padding:10px;color:var(--ink)}textarea{min-height:90px;resize:vertical}.switch{display:flex;align-items:center;gap:9px}.switch input{width:auto}.product{padding:0;overflow:hidden}.product-head{display:flex;align-items:center;gap:10px;padding:13px 16px;background:#f6f0e7;border-bottom:1px solid var(--line)}.product-head strong{margin-right:auto}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 8px}.product-body{padding:16px}.iconbtn{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 9px}.danger{color:var(--danger)}.add{width:100%;border:1px dashed var(--accent);background:transparent;border-radius:14px;padding:15px;color:var(--accent);font-weight:700}.notice{background:#fff7db;border:1px solid #e4cf80;padding:14px;border-radius:12px;line-height:1.7;margin-bottom:18px}.preview{background:#211b17;color:white;border-radius:16px;padding:28px}.preview h3{font-size:30px;margin:5px 0}.preview-products{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.preview-product{background:#f8f3eb;color:#241c17;border-radius:10px;padding:12px;min-height:110px}.preview-product small{color:#75685d}.footer-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 25%);padding:28px 0 5px;display:flex;justify-content:flex-end;gap:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:sticky;top:63px;z-index:9;display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}aside button{white-space:nowrap;width:auto;margin:0}.hint{display:none}main{padding:18px}.grid,.grid.three{grid-template-columns:1fr}.preview-products{grid-template-columns:repeat(2,1fr)}.top h1{width:100%}}
</style></head><body>
<input id="fallback" type="file" accept="application/json,.json" hidden><header class="top"><h1>KD Coffee Website Manager v1.0</h1><button class="btn primary" id="openBtn">開啟網站資料</button><button class="btn save" id="saveBtn">直接儲存</button><button class="btn" id="downloadBtn">下載 JSON</button><span class="status" id="status">尚未開啟檔案</span></header>
<div class="layout"><aside><button class="active" data-tab="campaign">本月活動</button><button data-tab="menu">豆單設定</button><button data-tab="products">作品管理</button><button data-tab="preview">快速預覽</button><div class="hint">建議從專案中開啟：<br><b>public/data/website-data.json</b><br><br>修改後按「直接儲存」，再重新整理網站即可看到結果。</div></aside>
<main>
<section class="panel active" id="campaign"><div class="panel-head"><div><h2>本月活動</h2><p>修改首頁第二區，不需要碰程式。</p></div><label class="switch"><input id="c-enabled" type="checkbox">顯示活動</label></div><div class="card grid"><div class="field"><label>英文小標</label><input id="c-eyebrow"></div><div class="field"><label>活動名稱</label><input id="c-title"></div><div class="field" style="grid-column:1/-1"><label>活動說明</label><textarea id="c-description"></textarea></div><div class="field"><label>特色 1</label><input id="c-detail1"></div><div class="field"><label>特色 2</label><input id="c-detail2"></div><div class="field"><label>主要按鈕文字</label><input id="c-ctaLabel"></div><div class="field"><label>主要按鈕連結</label><input id="c-ctaHref"></div><div class="field"><label>次要按鈕文字</label><input id="c-secondaryLabel"></div><div class="field"><label>次要按鈕連結</label><input id="c-secondaryHref"></div><div class="field"><label>視覺小字</label><input id="c-note"></div><div class="field"><label>活動圖片路徑（可留白）</label><input id="c-image" placeholder="/images/campaign/august.webp"></div></div></section>
<section class="panel" id="menu"><div class="panel-head"><div><h2>豆單設定</h2><p>修改月份、區塊標題和首頁說明。</p></div></div><div class="card grid"><div class="field"><label>月份英文標示</label><input id="m-monthLabel"></div><div class="field"><label>區塊標題</label><input id="m-title"></div><div class="field" style="grid-column:1/-1"><label>首頁說明</label><textarea id="m-intro"></textarea></div></div><div class="notice">首頁只會顯示勾選「首頁精選」的前 4 件作品；「全部作品」頁則顯示所有勾選「本月上架」的作品。</div></section>
<section class="panel" id="products"><div class="panel-head"><div><h2>作品管理</h2><p>上架、排序、價格、圖片與標籤都在這裡修改。</p></div><span id="productCount"></span></div><div id="productList"></div><button class="add" id="addProduct">＋ 新增一件咖啡作品</button></section>
<section class="panel" id="preview"><div class="panel-head"><div><h2>快速預覽</h2><p>確認活動與首頁精選，不代表正式網站排版。</p></div></div><div id="previewArea"></div></section>
<div class="footer-actions"><button class="btn" style="color:var(--ink);border-color:var(--line)" id="validateBtn">檢查資料</button><button class="btn save" id="saveBottom">儲存網站資料</button></div>
</main></div>
<script>
let data=null,fileHandle=null,dirty=false;const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setStatus(t){$('#status').textContent=t}function mark(){dirty=true;setStatus('有尚未儲存的修改')}
const defaultData={version:1,updatedAt:'',campaign:{enabled:true,eyebrow:'THIS MONTH AT KD COFFEE',title:'本月活動',description:'',details:['',''],ctaLabel:'了解更多',ctaHref:'#contact',secondaryLabel:'瀏覽作品',secondaryHref:'#products',note:'MONTHLY FEATURE',image:''},menu:{monthLabel:'2026 MONTHLY SELECTION',title:'本月咖啡作品',intro:'',products:[]}};
function slugify(v){return v.trim().toLowerCase().replace(/[^a-z0-9一-鿿]+/g,'-').replace(/^-|-$/g,'')||'coffee-work'}
function bindTop(){document.querySelectorAll('aside button[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('aside button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='preview')renderPreview()});}
async function openFile(){try{if(window.showOpenFilePicker){[fileHandle]=await showOpenFilePicker({types:[{description:'KD Coffee website data',accept:{'application/json':['.json']}}]});const f=await fileHandle.getFile();load(JSON.parse(await f.text()));setStatus('已開啟：'+f.name)}else{$('#fallback').click()}}catch(e){if(e.name!=='AbortError')alert('開啟失敗：'+e.message)}}
function load(obj){data=Object.assign(structuredClone(defaultData),obj);data.campaign=Object.assign(defaultData.campaign,obj.campaign||{});data.menu=Object.assign(defaultData.menu,obj.menu||{});data.menu.products=(obj.menu?.products||[]).map(p=>Object.assign({active:true,featured:false,tag:'',cover:'',poster:'',visualTone:'garden',flavors:[],purchase:[]},p));fill();dirty=false}
function fill(){const c=data.campaign,m=data.menu;['enabled','eyebrow','title','description','ctaLabel','ctaHref','secondaryLabel','secondaryHref','note','image'].forEach(k=>{const el=$('#c-'+k);if(el.type==='checkbox')el.checked=!!c[k];else el.value=c[k]??''});$('#c-detail1').value=c.details?.[0]||'';$('#c-detail2').value=c.details?.[1]||'';['monthLabel','title','intro'].forEach(k=>$('#m-'+k).value=m[k]||'');renderProducts();renderPreview()}
function syncBasic(){if(!data)return;const c=data.campaign,m=data.menu;c.enabled=$('#c-enabled').checked;['eyebrow','title','description','ctaLabel','ctaHref','secondaryLabel','secondaryHref','note','image'].forEach(k=>c[k]=$('#c-'+k).value.trim());c.details=[$('#c-detail1').value.trim(),$('#c-detail2').value.trim()].filter(Boolean);['monthLabel','title','intro'].forEach(k=>m[k]=$('#m-'+k).value.trim())}
function productTemplate(p,i){const opts=p.purchase||[];return `<article class="card product" data-i="${i}"><div class="product-head"><button class="iconbtn up" title="上移">↑</button><button class="iconbtn down" title="下移">↓</button><strong>${i+1}. ${esc(p.name||'未命名作品')}</strong>${p.active!==false?'<span class="badge">本月上架</span>':''}${p.featured?'<span class="badge">首頁精選</span>':''}<button class="iconbtn danger del">刪除</button></div><div class="product-body"><div class="grid three"><div class="field"><label>本月上架</label><label class="switch"><input data-k="active" type="checkbox" ${p.active!==false?'checked':''}>顯示這件作品</label></div><div class="field"><label>首頁精選</label><label class="switch"><input data-k="featured" type="checkbox" ${p.featured?'checked':''}>顯示在首頁</label></div><div class="field"><label>角落標籤</label><input data-k="tag" value="${esc(p.tag||'')}" placeholder="新品上市／本月推薦"></div><div class="field"><label>作品名稱</label><input data-k="name" value="${esc(p.name||'')}"></div><div class="field"><label>網址代號 slug</label><input data-k="slug" value="${esc(p.slug||'')}"></div><div class="field"><label>藝術家英文</label><input data-k="artist" value="${esc(p.artist||'')}"></div><div class="field" style="grid-column:1/-1"><label>風味短句</label><input data-k="subtitle" value="${esc(p.subtitle||'')}"></div><div class="field" style="grid-column:1/-1"><label>作品描述</label><textarea data-k="mood">${esc(p.mood||'')}</textarea></div><div class="field"><label>產區</label><input data-k="origin" value="${esc(p.origin||'')}"></div><div class="field"><label>處理法</label><input data-k="process" value="${esc(p.process||'')}"></div><div class="field"><label>烘焙度</label><input data-k="roast" value="${esc(p.roast||'')}"></div><div class="field"><label>風味（用頓號或逗號分隔）</label><input data-k="flavors" value="${esc((p.flavors||[]).join('、'))}"></div><div class="field"><label>卡片主視覺路徑</label><input data-k="cover" value="${esc(p.cover||'')}" placeholder="/images/works/xxx.webp"></div><div class="field"><label>廣告單路徑</label><input data-k="poster" value="${esc(p.poster||'')}" placeholder="/images/posters/xxx.webp"></div><div class="field"><label>預設視覺主題</label><select data-k="visualTone">${['dawn','renaissance','garden','sunset','knight','melody','kiss','starry'].map(v=>`<option ${p.visualTone===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>半磅規格</label><input data-k="beanDetail" value="${esc(opts[0]?.detail||'227g')}"></div><div class="field"><label>半磅售價 NT$</label><input data-k="beanPrice" type="number" min="0" value="${Number(opts[0]?.price||0)}"></div><div class="field"><label>耳掛規格</label><input data-k="dripDetail" value="${esc(opts[1]?.detail||'10入／每包12g')}"></div><div class="field"><label>耳掛售價 NT$</label><input data-k="dripPrice" type="number" min="0" value="${Number(opts[1]?.price||0)}"></div></div></div></article>`}
function renderProducts(){const list=$('#productList');list.innerHTML=data.menu.products.map(productTemplate).join('');$('#productCount').textContent=`共 ${data.menu.products.length} 件`;list.querySelectorAll('.product').forEach(card=>{const i=+card.dataset.i;card.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{let k=el.dataset.k,v=el.type==='checkbox'?el.checked:el.value;if(k==='flavors')v=v.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);else if(k==='beanPrice'||k==='dripPrice')v=Number(v)||0;if(k==='beanDetail'||k==='beanPrice'||k==='dripDetail'||k==='dripPrice'){const p=data.menu.products[i];p.purchase=p.purchase||[];p.purchase[0]={label:'半磅咖啡豆',detail:k==='beanDetail'?v:(p.purchase[0]?.detail||'227g'),price:k==='beanPrice'?v:(p.purchase[0]?.price||0)};p.purchase[1]={label:'耳掛咖啡',detail:k==='dripDetail'?v:(p.purchase[1]?.detail||'10入／每包12g'),price:k==='dripPrice'?v:(p.purchase[1]?.price||0)}}else data.menu.products[i][k]=v;mark();if(k==='name'||k==='active'||k==='featured')renderProducts()});card.querySelector('.up').onclick=()=>move(i,-1);card.querySelector('.down').onclick=()=>move(i,1);card.querySelector('.del').onclick=()=>{if(confirm('確定刪除「'+(data.menu.products[i].name||'未命名作品')+'」？')){data.menu.products.splice(i,1);mark();renderProducts()}}})}
function move(i,d){const j=i+d;if(j<0||j>=data.menu.products.length)return;[data.menu.products[i],data.menu.products[j]]=[data.menu.products[j],data.menu.products[i]];mark();renderProducts()}
function addProduct(){const n=data.menu.products.length+1;data.menu.products.push({active:true,featured:false,slug:'new-coffee-'+n,name:'新咖啡作品',artist:'ARTIST',subtitle:'',mood:'',origin:'',process:'',roast:'',flavors:[],tag:'',cover:'',poster:'',visualTone:'garden',purchase:[{label:'半磅咖啡豆',detail:'227g',price:700},{label:'耳掛咖啡',detail:'10入／每包12g',price:500}]});mark();renderProducts();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function validate(){syncBasic();const errs=[],slugs=new Set();if(!data.campaign.title)errs.push('本月活動缺少活動名稱');if(!data.menu.monthLabel)errs.push('豆單缺少月份');data.menu.products.forEach((p,i)=>{if(!p.name)errs.push(`第 ${i+1} 件缺少作品名稱`);if(!p.slug)errs.push(`${p.name||'第 '+(i+1)+' 件'}缺少 slug`);if(slugs.has(p.slug))errs.push(`slug 重複：${p.slug}`);slugs.add(p.slug)});const f=data.menu.products.filter(p=>p.active!==false&&p.featured);if(f.length>4)errs.push(`首頁精選有 ${f.length} 件，首頁只會顯示前 4 件`);if(!data.menu.products.some(p=>p.active!==false))errs.push('目前沒有任何本月上架作品');alert(errs.length?'請確認：\n\n• '+errs.join('\n• '):'資料檢查完成，沒有發現問題。');return !errs.length}
function prepare(){syncBasic();data.updatedAt=new Date().toISOString().slice(0,10);return JSON.stringify(data,null,2)}
async function save(){if(!data)return alert('請先開啟 website-data.json');try{if(fileHandle){const w=await fileHandle.createWritable();await w.write(prepare());await w.close();dirty=false;setStatus('已直接儲存 · '+new Date().toLocaleTimeString('zh-TW'));alert('已儲存完成。回到網站重新整理即可查看。')}else download()}catch(e){alert('儲存失敗：'+e.message)}}
function download(){if(!data)return alert('請先開啟資料');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([prepare()],{type:'application/json'}));a.download='website-data.json';a.click();URL.revokeObjectURL(a.href);dirty=false;setStatus('已下載 website-data.json');setTimeout(()=>alert('下一步：請把剛下載的 website-data.json 覆蓋到專案的 public\\data\\website-data.json，然後回到網站按 Ctrl+F5 重新整理。'),120)}
function renderPreview(){if(!data)return $('#previewArea').innerHTML='<div class="notice">請先開啟網站資料。</div>';syncBasic();const c=data.campaign,ps=data.menu.products.filter(p=>p.active!==false&&p.featured).slice(0,4);$('#previewArea').innerHTML=`<div class="preview"><small>${esc(c.eyebrow)}</small><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p></div><div class="card"><small>${esc(data.menu.monthLabel)}</small><h3>${esc(data.menu.title)}</h3><div class="preview-products">${ps.map(p=>`<div class="preview-product"><small>${esc(p.artist)}</small><h4>${esc(p.name)}</h4><p>${esc(p.subtitle)}</p></div>`).join('')||'<p>尚未選擇首頁精選作品</p>'}</div></div>`}
document.addEventListener('input',e=>{if(e.target.closest('#campaign,#menu'))mark()});$('#fallback').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{load(JSON.parse(await f.text()));setStatus('已開啟：'+f.name+'（請用下載 JSON 儲存）')}catch(err){alert('檔案格式錯誤：'+err.message)}};$('#openBtn').onclick=openFile;$('#saveBtn').onclick=save;$('#saveBottom').onclick=save;$('#downloadBtn').onclick=download;$('#validateBtn').onclick=validate;$('#addProduct').onclick=addProduct;window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};bindTop();load(structuredClone(defaultData));setStatus('請開啟專案中的 website-data.json');
</script></body></html>
