<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KD Coffee 7-ELEVEN 門市資料管理器</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f4efe7;color:#251b16;margin:0}main{max-width:1180px;margin:auto;padding:32px}.card{background:#fff;border:1px solid #d8cbbb;border-radius:18px;padding:22px;margin-bottom:18px}h1{font-family:Georgia,serif;font-size:38px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:grid;gap:6px;font-size:13px}input,textarea,select,button{font:inherit;padding:11px;border:1px solid #cdbdac;border-radius:10px}button{cursor:pointer;background:#241a15;color:#fff}.secondary{background:#fff;color:#241a15}.actions{display:flex;gap:10px;flex-wrap:wrap}.table{display:grid;gap:8px}.row{display:grid;grid-template-columns:90px 120px 1fr 130px;gap:10px;align-items:center;padding:12px;border:1px solid #e1d7cb;border-radius:12px}.row small{display:block;color:#786b61}.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.warn{background:#fff6e8;border-left:4px solid #c39045;padding:12px;line-height:1.6}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}}</style></head><body><main><h1>KD Coffee 7-ELEVEN 門市資料管理器</h1><p>新增、修改、搜尋與匯出 <code>public/data/711-stores.json</code>。資料需先由官方門市查詢核對。</p><div class="card warn">這個工具不會自動抓取 7-ELEVEN。請先開啟官方門市查詢核對店號、店名與地址，再新增。匯出後將 JSON 覆蓋到網站的 <code>public/data/711-stores.json</code>。</div><div class="card"><div class="actions"><label class="secondary">載入既有 JSON<input id="file" type="file" accept="application/json"></label><button id="export">匯出 711-stores.json</button><button class="secondary" id="official">開啟官方門市查詢</button><button class="secondary" id="clear">清空表單</button></div></div><div class="card"><h2>新增／編輯門市</h2><div class="grid"><label>店號<input id="id" inputmode="numeric"></label><label>門市名稱<input id="name"></label><label>電話<input id="phone"></label><label>縣市<input id="city" value="高雄市"></label><label>行政區<input id="district"></label><label>路名<input id="road"></label></div><label style="margin-top:12px">完整地址<input id="address"></label><div class="actions" style="margin-top:14px"><button id="save">儲存門市</button><button class="secondary" id="remove">刪除目前店號</button></div></div><div class="card"><div class="status"><h2>門市清單</h2><label>搜尋<input id="q" placeholder="店號、店名、地址、行政區"></label></div><p id="count"></p><div id="list" class="table"></div></div></main><script>
let data={metadata:{title:'KD Coffee 7-ELEVEN 門市資料庫',version:'1.1.0',lastUpdated:new Date().toISOString().slice(0,10),sourceNote:'網站自主管理門市資料',officialLookupUrl:'https://emap.pcsc.com.tw/emap.aspx',isComplete:false},stores:[]};
const $=id=>document.getElementById(id), fields=['id','name','phone','city','district','road','address'];
function form(){return Object.fromEntries(fields.map(k=>[k,$(k).value.trim()]));} function fill(s={}){fields.forEach(k=>$(k).value=s[k]||'');}
function render(){const q=$('q').value.trim().toLowerCase();const rows=data.stores.filter(s=>JSON.stringify(s).toLowerCase().includes(q)).sort((a,b)=>(a.city+a.district+a.name).localeCompare(b.city+b.district+b.name,'zh-Hant'));$('count').textContent=`共 ${data.stores.length} 間，顯示 ${rows.length} 間`;$('list').innerHTML=rows.map(s=>`<button class="row secondary" data-id="${s.id}"><b>${s.id}</b><b>${s.name}</b><span>${s.address}<small>${s.city}・${s.district}・${s.road||''}${s.phone?'・'+s.phone:''}</small></span><span>${s.verified?'已核對':'待核對'}</span></button>`).join('');document.querySelectorAll('.row').forEach(b=>b.onclick=()=>fill(data.stores.find(s=>s.id===b.dataset.id)));}
$('save').onclick=()=>{const s=form();if(!s.id||!s.name||!s.city||!s.district||!s.address)return alert('店號、店名、縣市、行政區與地址為必填');s.verified=true;s.verifiedAt=new Date().toISOString().slice(0,10);s.source='管理者以官方門市查詢核對';const i=data.stores.findIndex(x=>x.id===s.id);if(i>=0)data.stores[i]=s;else data.stores.push(s);data.metadata.lastUpdated=new Date().toISOString().slice(0,10);render();alert('已儲存');};
$('remove').onclick=()=>{const id=$('id').value.trim();if(!id)return;data.stores=data.stores.filter(s=>s.id!==id);fill();render();};$('clear').onclick=()=>fill({city:'高雄市'});$('q').oninput=render;$('official').onclick=()=>open(data.metadata.officialLookupUrl,'_blank');
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.stores))throw Error();data=x;render();}catch{alert('JSON 格式不正確')}};
$('export').onclick=()=>{data.metadata.lastUpdated=new Date().toISOString().slice(0,10);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='711-stores.json';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
